services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-forense-db
    environment:
      POSTGRES_DB: kanban_forense
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
